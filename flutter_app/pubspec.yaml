name: gymxbook
description: GymXBook - Gym Management Flutter App - Production
publish_to: "none"
version: 1.2.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  intl: ^0.19.0
  mobile_scanner: ^3.5.7
  path_provider: ^2.1.2
  share_plus: ^12.0.2
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  image_cropper: ^8.1.0
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  timezone: ^0.9.4
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/images/gymxbook_logo_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/gymxbook_logo_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
