# Stable Gradle settings for a lower-memory Windows build machine.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -Xss512k -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx512m

android.useAndroidX=true
android.enableJetifier=true

# Use ML Kit through Google Play Services instead of bundling old native
# barcode libraries that do not support Android 16 KB memory pages.
dev.steenbakker.mobile_scanner.useUnbundled=true
